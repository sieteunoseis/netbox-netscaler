[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-netscaler"
version = "0.1.0"
description = "Read-only NetBox plugin showing Citrix NetScaler VIPs, service group members and GSLB names on VMs and devices"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "sieteunoseis", email = "jeremy.worden@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["netbox", "netscaler", "citrix", "load balancer", "gslb", "plugin"]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/sieteunoseis/netbox-netscaler"
Repository = "https://github.com/sieteunoseis/netbox-netscaler"
Issues = "https://github.com/sieteunoseis/netbox-netscaler/issues"
Documentation = "https://github.com/sieteunoseis/netbox-netscaler/wiki"
Changelog = "https://github.com/sieteunoseis/netbox-netscaler/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
]

[tool.setuptools.packages.find]
include = ["netbox_netscaler*"]

[tool.setuptools.package-data]
netbox_netscaler = ["templates/**/*.html"]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
